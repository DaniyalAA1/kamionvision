<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     fill="none" aria-hidden="true" class="elev">
<!--
  Side elevation of a 4x2 tractor unit. Front is left. Drawn for this screen
  rather than traced from any one truck, but to real proportions at 1 m =
  100 px: 5.9 m long, 3.85 m tall, 3.6 m wheelbase, 1.05 m wheels, fifth
  wheel at 1.15 m. The short rear overhang is what makes it a tractor unit
  and not a rigid - the thing the pricing stage refuses to guess at.

  Every group carries a data-component matching one of the 33 values in
  app/evidence.py COMPONENTS, so gate view coverage and vision-model findings
  bind straight onto the drawing. Three components have no geometry of their
  own and alias a panel they would be observed on: paint_finish ->
  cab_exterior_panels, corrosion -> chassis_frame, fluid_leaks ->
  undercarriage.

  Two drafting conventions do real work here. The cab interior and the engine
  are in phantom line: present, but not visible from outside. The AdBlue tank
  is also phantom because on this layout it sits on the off side, behind the
  fuel tank - you would not see it from this side at all.
-->
<g class="elev-chrome">
  <line class="ground" x1="16" y1="400" x2="744" y2="400"/>
  <g class="hatch">
    <line x1="20"  y1="410" x2="32"  y2="400"/><line x1="56"  y1="410" x2="68"  y2="400"/>
    <line x1="92"  y1="410" x2="104" y2="400"/><line x1="128" y1="410" x2="140" y2="400"/>
    <line x1="164" y1="410" x2="176" y2="400"/><line x1="200" y1="410" x2="212" y2="400"/>
    <line x1="236" y1="410" x2="248" y2="400"/><line x1="272" y1="410" x2="284" y2="400"/>
    <line x1="308" y1="410" x2="320" y2="400"/><line x1="344" y1="410" x2="356" y2="400"/>
    <line x1="380" y1="410" x2="392" y2="400"/><line x1="416" y1="410" x2="428" y2="400"/>
    <line x1="452" y1="410" x2="464" y2="400"/><line x1="488" y1="410" x2="500" y2="400"/>
    <line x1="524" y1="410" x2="536" y2="400"/><line x1="560" y1="410" x2="572" y2="400"/>
    <line x1="596" y1="410" x2="608" y2="400"/><line x1="632" y1="410" x2="644" y2="400"/>
    <line x1="668" y1="410" x2="680" y2="400"/><line x1="704" y1="410" x2="716" y2="400"/>
  </g>
  <line class="centre" x1="210" y1="288" x2="210" y2="430"/>
  <line class="centre" x1="570" y1="288" x2="570" y2="430"/>
  <line class="centre" x1="140" y1="348" x2="280" y2="348"/>
  <line class="centre" x1="500" y1="348" x2="640" y2="348"/>
</g>

